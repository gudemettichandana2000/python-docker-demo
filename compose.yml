---
services:
  db:
    container_name: db
    image: library-db:v1
    build: ./database/
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    container_name: auth_service
    image: auth-service:v1
    build: ./auth/
    ports:
      - "5001:5001"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  book_service:
    container_name: book_service
    image: book-service:v1
    build: ./book/
    ports:
      - "5002:5002"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  borrow_service:
    container_name: borrow_service
    image: borrow-service:v1
    build: ./borrow/
    ports:
      - "5003:5003"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  frontend:
    container_name: frontend
    image: web-app:v1
    build: ./
    ports:
      - "5000:5000"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
networks:
  myapp:
    driver: overlay
volumes:
  mydata:
